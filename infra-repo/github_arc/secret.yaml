# Secret holding the GitHub PAT that ARC uses to register runners.
#
# WARNING: never commit a real token to git. Replace the placeholder only in a
# local copy, apply it, then revert the value (or keep the real file out of git).
apiVersion: v1
kind: Secret
metadata:
  name: github-pat          # referenced by Helm: --set githubConfigSecret=github-pat
  namespace: arc-runner   # must be the same namespace as the runner scale set
type: Opaque
stringData:                 # plain text here; Kubernetes base64-encodes it into `data`
  github_token: "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"   # key name ARC expects
