apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-deploy
  labels:
    app: shop-deploy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shop-app
  template:
    metadata:
      labels:
        app: shop-app
    spec:
      containers:
        - name: shop-app
          image: minimarket/shop-service
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: INVENTORY_URL
              value: "http://inventory-svc"
            - name: PAYMENT_URL
              value: "http://payment-svc"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
