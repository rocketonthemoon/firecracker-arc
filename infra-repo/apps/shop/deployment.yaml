apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-deployment
  labels:
    app: shop-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop-service
          image: minimarket/shop-service
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: INVENTORY_URL
              value: "http://inventory-service"
            - name: PAYMENT_URL
              value: "http://payment-service"
