apiVersion: v1
kind: Pod
metadata:
  name: fc-test
  namespace: katatest
  labels:
    sandbox: "true"
spec:
  runtimeClassName: kata-fc # <- this one line makes the pod a Firecracker microVM
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: alpine
      image: docker.io/library/alpine:latest
      command: ["sleep", "3600"]
      resources:
        limits:
          cpu: "1"
          memory: "256Mi"
